[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-rag-evaluation"
version = "0.1.0"
description = "A small benchmark for grounded answers from public financial documents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fin-eval = "financial_rag_eval.cli:main"

[tool.setuptools.packages.find]
include = ["financial_rag_eval*"]

[tool.setuptools.package-data]
financial_rag_eval = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
